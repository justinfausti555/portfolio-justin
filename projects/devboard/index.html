<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevBoard, um quadro Kanban para organizar projetos de desenvolvimento.">
  <title>Justin:F05 | DevBoard</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="shell">
    <aside class="sidebar">
      <a class="brand" href="."><span>JF</span> DevBoard</a>
      <nav aria-label="Navegação principal"><a class="active" href="#board">Quadro</a><a href="#insights">Resumo</a></nav>
      <div class="sidebar-note"><span class="status-dot"></span><strong>Espaço pessoal</strong><small>Organização de projetos</small></div>
    </aside>
    <section class="workspace" id="board">
      <header class="topbar"><div><p class="eyebrow">Área de trabalho</p><h1>Projetos de desenvolvimento</h1></div><button id="new-task" class="primary" type="button">+ Nova tarefa</button></header>
      <div class="toolbar"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Pesquisar tarefas..."></label><span id="board-count" class="count"></span></div>
      <section class="board" aria-label="Quadro Kanban">
        <div class="column" data-status="todo"><div class="column-heading"><h2>Backlog</h2><span class="column-count">0</span></div><div class="drop-zone"></div></div>
        <div class="column" data-status="progress"><div class="column-heading"><h2>Em progresso</h2><span class="column-count">0</span></div><div class="drop-zone"></div></div>
        <div class="column" data-status="done"><div class="column-heading"><h2>Concluído</h2><span class="column-count">0</span></div><div class="drop-zone"></div></div>
      </section>
      <section id="insights" class="insights"><div><span>Total de tarefas</span><strong id="total-stat">0</strong></div><div><span>Em progresso</span><strong id="progress-stat">0</strong></div><div><span>Concluídas</span><strong id="done-stat">0</strong></div></section>
    </section>
  </main>
  <dialog id="task-dialog"><form id="task-form" method="dialog"><button class="close" value="cancel" aria-label="Fechar">&times;</button><p class="eyebrow">Nova tarefa</p><h2>Adicionar ao quadro</h2><label for="task-title">Título</label><input id="task-title" maxlength="80" required placeholder="Ex.: Criar página de contacto"><label for="task-label">Categoria</label><select id="task-label"><option>Frontend</option><option>Backend</option><option>Estudo</option><option>Segurança</option></select><div class="dialog-actions"><button value="cancel" type="button" id="cancel-dialog">Cancelar</button><button class="primary" value="default" type="submit">Adicionar tarefa</button></div></form></dialog>
</body>
</html>
